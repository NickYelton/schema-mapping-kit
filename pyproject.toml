[project]
name = "schema-mapping-kit"
version = "0.1.0"
description = "Profile a messy customer file, propose a mapping to a canonical schema, and compile a deterministic transform."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0.0",
    "charset-normalizer>=3.5.1",
    "duckdb>=1.5.5",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "model2vec>=0.9.0",
    "pandera[polars]>=0.32.1",
    "polars[calamine]>=1.44.1",
    "pyarrow>=22.0.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.14.5",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
    "xlsxwriter>=3.2.9",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Form"]
